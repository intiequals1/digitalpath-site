name: Verify ML-DSA Provenance

# Offene Mitarbeit: Pull Requests von allen werden nur auf Integrität geprüft
# (vorhandene Signaturen gültig, Schlüssel unverändert verankert). Ein noch nicht
# signierter Stand blockiert keinen Beitrag. Der Maintainer signiert nach dem Merge.
# Tags "attested-*" und manuelle Läufe verlangen einen attestierten aktuellen Stand.

on:
  push:
    branches: ['**']
    tags: ['attested-*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'integrity oder current'
        required: false
        default: 'current'

permissions:
  contents: read

jobs:
  verify-ml-dsa-provenance:
    name: Verify ML-DSA Provenance
    runs-on: ubuntu-26.04
    steps:
      - name: Check out full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check OpenSSL and Python
        run: |
          openssl version
          python3 --version

      - name: Verify signed snapshots
        shell: bash
        env:
          PROVENANCE_PUBLIC_KEY_SHA256: ${{ vars.PROVENANCE_PUBLIC_KEY_SHA256 }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          mode=integrity
          if [[ "${GITHUB_REF}" == refs/tags/attested-* ]]; then mode=current; fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_MODE}" ]]; then mode="${INPUT_MODE}"; fi
          if compgen -G 'provenance/attestations/attestation-*.json' > /dev/null; then
            python3 scripts/provenance/verify_attestations.py --require-anchor --mode "${mode}"
          else
            echo '::warning::ML-DSA provenance is not activated yet. See provenance/README.md.'
            echo '## ML-DSA-Provenienz noch nicht aktiviert' >> "$GITHUB_STEP_SUMMARY"
            echo 'Noch keine signierte Attestierung vorhanden. Siehe `provenance/README.md`.' >> "$GITHUB_STEP_SUMMARY"
          fi
